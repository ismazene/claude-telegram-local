[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgmedia"
version = "0.1.0"
description = "Local audio transcription and video frame extraction for chat-bot agents such as Claude Code over Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.0", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tgmedia = "tgmedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
